# Bidirectional sync of two volumes. Start one of the two layouts:
#   docker compose -f examples/sync/compose.yaml up -d sync-single      one worker, both volumes
#   docker compose -f examples/sync/compose.yaml up -d sync-west sync-east   two workers, one volume each
# Add sync-portal to either command to get the web portal on https://127.0.0.1:8443.
x-worker: &worker
  build:
    context: ../..
    dockerfile: Dockerfile
  image: backup:latest
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  # KILL lets the init process (tini, runs as root) forward signals to the worker after it dropped to PUID/PGID
  cap_add: [CHOWN, SETUID, SETGID, KILL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  environment:
    - CONTROL_MODE=portal
    - CONTROL_API_PASSWORDFILE=/run/secrets/portal_password
    - CONTROL_PASSWORD_FILE=/run/secrets/portal_password
    - PUID=1000
    - PGID=1000

services:
  sync-single:
    <<: *worker
    container_name: sync-single
    volumes:
      - ./volumes/single/a:/sync/a
      - ./volumes/single/b:/sync/b
      - ./volumes/single:/var/lib/control   # copy single/control.yaml here before the first start
    secrets: [portal_password]

  sync-west:
    <<: *worker
    container_name: sync-west
    volumes:
      - ./volumes/control/west:/var/lib/control
      - ./volumes/sync/west:/sync
    secrets: [portal_password]
    ports:
      - "9080:9080"
    # copy west/control.yaml to ./volumes/control/west/control.yaml before the first start

  sync-east:
    <<: *worker
    container_name: sync-east
    volumes:
      - ./volumes/control/east:/var/lib/control
      - ./volumes/sync/east:/sync
    secrets: [portal_password]
    ports:
      - "9081:9080"
    # copy east/control.yaml to ./volumes/control/east/control.yaml before the first start

  # The web portal, started on its own: docker compose -f examples/sync/compose.yaml up -d sync-west-portal
  # It talks to one daemon, sync-west by default. Point it at another one with
  # SYNC_PORTAL_DAEMON=http://sync-single:9080 (or http://sync-east:9080).
  sync-west-portal:
    <<: *worker
    container_name: sync-west-portal
    command: ["web"]
    mem_limit: 128m
    volumes:
      - ./volumes/portal/west:/var/lib/portal
    secrets: [portal_password]
    ports:
      # loopback only, put a reverse proxy with a certificate in front to reach it from the network
      - "127.0.0.1:8443:8443"
    environment:
      - PUID=1000
      - PGID=1000
      - PORTAL_DAEMON_URL=${SYNC_PORTAL_DAEMON:-http://sync-west:9080}
      - PORTAL_PASSWORDFILE=/run/secrets/portal_password
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/"]
      interval: 1m
      timeout: 10s
      start_period: 15s
      retries: 3

  sync-east-portal:
    <<: *worker
    container_name: sync-east-portal
    command: ["web"]
    mem_limit: 128m
    volumes:
      - ./volumes/portal/east:/var/lib/portal
    secrets: [portal_password]
    ports:
      # loopback only, put a reverse proxy with a certificate in front to reach it from the network
      - "127.0.0.1:8444:8443"
    environment:
      - PUID=1000
      - PGID=1000
      - PORTAL_DAEMON_URL=${SYNC_PORTAL_DAEMON:-http://sync-east:9080}
      - PORTAL_PASSWORDFILE=/run/secrets/portal_password
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/"]
      interval: 1m
      timeout: 10s
      start_period: 15s
      retries: 3

secrets:
  portal_password:
    file: ./secrets/portal_password
