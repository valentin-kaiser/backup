version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "Valentin-Kaiser"
    reviewers:
      - "Valentin-Kaiser"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "Valentin-Kaiser"
    reviewers:
      - "Valentin-Kaiser"
  - package-ecosystem: "npm"
    directory: "/worker/portal/ui"
    schedule:
      interval: "weekly"
    groups:
      angular:
        patterns:
          - "@angular/*"
    assignees:
      - "Valentin-Kaiser"
    reviewers:
      - "Valentin-Kaiser"
